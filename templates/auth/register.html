{% extends "base.html" %}

{% block title %}Créer un compte — CleanHome{% endblock %}

{% block content %}
  <div class="auth-wrap">
    <div class="auth-card wide">
      <h1>Créer votre compte</h1>
      <p class="subtitle">Quelques informations et vous pourrez réserver votre première prestation.</p>

      {% if error %}
        <div class="alert" role="alert">{{ error }}</div>
      {% endif %}

      <form action="/register" method="post">
        <div class="field">
          <label for="full_name">Nom complet</label>
          <input id="full_name" name="full_name" type="text" placeholder="Ex : Awa Traoré" required />
        </div>

        <div class="field">
          <label for="email">Adresse e-mail</label>
          <input id="email" name="email" type="email" placeholder="vous@exemple.com" required />
        </div>

        <div class="field">
          <label for="phone">Téléphone</label>
          <input id="phone" name="phone" type="tel" placeholder="+225 07 00 00 00 00" required />
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required />
        </div>

        <div class="field">
          <label for="confirm">Confirmer le mot de passe</label>
          <input id="confirm" name="confirm" type="password" placeholder="••••••••" required />
        </div>

        <button class="btn-primary" style="width:100%;padding:14px;margin-top:10px;" type="submit">
          Créer mon compte
        </button>
      </form>

      <div class="auth-footer">
        Déjà inscrit ? <a href="/login">Connexion</a>
      </div>
    </div>
  </div>
{% endblock %}
