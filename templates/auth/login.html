{% extends "base.html" %}

{% block title %}Connexion — CleanHome{% endblock %}

{% block content %}
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Connexion</h1>
      <p class="subtitle">Accédez à votre compte pour réserver une prestation.</p>

      {% if error %}
        <div class="alert" role="alert">{{ error }}</div>
      {% endif %}

      <form action="/login" method="post">
        {% if next %}
          <input type="hidden" name="next" value="{{ next }}" />
        {% endif %}
        <div class="field">
          <label for="email">Adresse e-mail</label>
          <input id="email" name="email" type="email" placeholder="vous@exemple.com" required />
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required />
        </div>

        <button class="btn-primary" style="width:100%;padding:14px;margin-top:8px;" type="submit">
          Se connecter
        </button>
      </form>

      <div class="auth-footer">
        Vous n'avez pas encore de compte ?<br>
        <a href="/register">Créer un compte</a>
      </div>
    </div>
  </div>
{% endblock %}
